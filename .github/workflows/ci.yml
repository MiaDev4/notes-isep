name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: action/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer pytest
        run: pytest -v
